<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demostración de un buscador de estudiantes con datos ficticios.">
    <title>Buscador de estudiantes</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #162724;
            background: #f4f6f1;
            --green: #1d5c4c;
            --muted: #4d605b;
            --line: #d9e3db;
        }

        * { box-sizing: border-box; }
        body { margin: 0; }

        main {
            max-width: 54rem;
            margin: 0 auto;
            padding: clamp(2rem, 8vw, 5rem) clamp(1rem, 5vw, 3rem) 3rem;
        }

        .intro {
            padding: clamp(1.5rem, 6vw, 3rem);
            border-radius: 1.25rem;
            background: #163b33;
            color: #fff;
        }

        .demo {
            display: inline-block;
            margin: 0 0 1rem;
            padding: .3rem .7rem;
            border: 1px solid #77988b;
            border-radius: 2rem;
            color: #e1eee7;
            font-size: .875rem;
        }

        h1 {
            margin: 0;
            max-width: 16ch;
            font-size: clamp(2rem, 7vw, 3.75rem);
            line-height: 1.02;
            letter-spacing: -.045em;
        }

        .intro p:last-child {
            margin: 1rem 0 0;
            color: #e1eee7;
            line-height: 1.5;
        }

        .search {
            margin-top: 1.25rem;
            padding: clamp(1rem, 4vw, 1.75rem);
            border: 1px solid var(--line);
            border-radius: 1.25rem;
            background: #fff;
        }

        label { display: block; font-weight: 650; }

        input {
            display: block;
            width: 100%;
            margin-top: .5rem;
            padding: .85rem 1rem;
            border: 1px solid #829a90;
            border-radius: .65rem;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        input::placeholder { color: #596b65; }

        :focus-visible {
            outline: 3px solid #207c67;
            outline-offset: 3px;
        }

        #resultados-estado {
            margin: 1rem 0 .35rem;
            color: var(--muted);
            font-size: .875rem;
            line-height: 1.5;
        }

        .students {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .students > li {
            border-top: 1px solid var(--line);
        }

        .student {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem .25rem;
        }

        .initials {
            display: grid;
            place-items: center;
            flex: 0 0 2.5rem;
            height: 2.5rem;
            border-radius: .65rem;
            background: #e5f0eb;
            color: var(--green);
            font-size: .875rem;
            font-weight: 700;
        }

        .name { flex: 1; overflow-wrap: anywhere; }
        .course { color: var(--muted); font-size: .875rem; }

        @media (max-width: 28rem) {
            .student {
                display: grid;
                grid-template-columns: 2.5rem 1fr;
                gap: .2rem .75rem;
            }

            .initials { grid-row: span 2; }
        }
    </style>
</head>
<body>
    <main>
        <header class="intro">
            <p class="demo">Datos ficticios</p>
            <h1>Buscador de estudiantes</h1>
            <p>Encuentra estudiantes de ejemplo por nombre, apellido o curso.</p>
        </header>

        <section class="search" aria-label="Búsqueda de estudiantes">
            <label for="consulta">Nombre, apellido o curso</label>
            <input id="consulta" type="search" placeholder="Ej. Martín o 7° básico" autocomplete="off">
            <p id="resultados-estado" role="status"></p>
            <ul id="resultados" class="students" aria-label="Resultados"></ul>
            <noscript>Activa JavaScript para usar el buscador.</noscript>
        </section>
    </main>

    <script>
        const students = [
            { name: 'Amanda Ríos', course: '7° básico A' },
            { name: 'Emilia Vega', course: '8° básico B' },
            { name: 'Martín Soto', course: '7° básico A' },
            { name: 'Tomás Luna', course: '1° medio A' }
        ];

        const search = document.getElementById('consulta');
        const results = document.getElementById('resultados');
        const status = document.getElementById('resultados-estado');

        function normalize(value) {
            return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function render() {
            const query = normalize(search.value.trim());
            const terms = query ? query.split(/\s+/) : [];
            const matches = students.filter(({ name, course }) => {
                const candidate = normalize(`${name} ${course}`);
                return terms.every((term) => candidate.includes(term));
            });

            results.replaceChildren(...matches.map(({ name, course }) => {
                const item = document.createElement('li');
                const row = document.createElement('div');
                const initials = document.createElement('span');
                const nameField = document.createElement('strong');
                const courseField = document.createElement('span');

                row.className = 'student';
                initials.className = 'initials';
                initials.setAttribute('aria-hidden', 'true');
                initials.textContent = name.split(' ').map((part) => part[0]).join('');
                nameField.className = 'name';
                nameField.textContent = name;
                courseField.className = 'course';
                courseField.textContent = course;

                row.append(initials, nameField, courseField);
                item.append(row);
                return item;
            }));

            status.textContent = matches.length === 0
                ? 'No se encontraron estudiantes.'
                : `${matches.length} ${matches.length === 1 ? 'estudiante' : 'estudiantes'}`;
        }

        search.addEventListener('input', render);
        render();
    </script>
</body>
</html>
